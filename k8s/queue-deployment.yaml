apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queue-service
  template:
    metadata:
      labels:
        app: queue-service
    spec:
      containers:
      - name: queue-service
        image: yourdockerhub/queue-service
        ports:
        - containerPort: 3003
        env:
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: mediqueue-secrets
                key: JWT_SECRET
          - name: RABBITMQ_URL
            valueFrom:
              secretKeyRef:
                name: mediqueue-secrets
                key: RABBITMQ_URL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 10