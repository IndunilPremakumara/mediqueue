services:

  user-service:
    build: ./services/user-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/user-service/.env
    depends_on:
      mongo:
        condition: service_healthy

  appointment-service:
    build: ./services/appointment-service
    ports:
      - "3002:3002"
    env_file:
      - ./services/appointment-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queue-service:
    build: ./services/queue-service
    ports:
      - "3003:3003"
    env_file:
      - ./services/queue-service/.env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "8081:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
    depends_on:
      user-service:
        condition: service_started
      appointment-service:
        condition: service_started
      queue-service:
        condition: service_started

  notification-service:
    build: ./services/notification-service
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq}
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres
    environment:
      POSTGRES_DB: mediqueue
      POSTGRES_PASSWORD: password
    volumes:
      - ./services/appointment-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongo-data:
  postgres-data:
  redis-data: